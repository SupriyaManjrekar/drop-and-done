<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Drop &amp; Done: how it works</title>
<desc id="d">An employee drops bills into a chat. The AI reads each bill. Plain, tested rules code decides. The claim is submitted to a mock reimbursement system, then approved and paid. Below: what is built in the prototype and what is planned for production.</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;family=Schibsted+Grotesk:wght@800;900&amp;display=swap');
text { font-family: Archivo, 'Segoe UI', Helvetica, Arial, sans-serif; }
.h1 { font-size: 44px; font-weight: 900; fill: #141414; letter-spacing: -0.02em; }
.sub { font-size: 22px; font-weight: 500; fill: #3D3D3D; }
.lab { font-size: 22px; font-weight: 800; letter-spacing: 0.01em; }
.h2 { font-size: 28px; font-weight: 800; fill: #141414; letter-spacing: -0.01em; }
.b { font-size: 18px; font-weight: 500; fill: #3D3D3D; }
.tag { font-size: 15px; font-weight: 700; fill: #000093; }
.h3 { font-size: 24px; font-weight: 800; fill: #141414; }
.li { font-size: 19px; font-weight: 500; fill: #3D3D3D; }
.lip { font-size: 19px; font-weight: 500; fill: #5A5A5A; }
.amp { font-family: 'Schibsted Grotesk', Archivo, 'Segoe UI', Arial, sans-serif; }
.foot { font-size: 15px; font-weight: 500; fill: #5A5A5A; }
</style>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<g transform="translate(64,58) scale(3.4)"><circle cx="12" cy="12" r="12" fill="#3535F3"/><path d="M17.587 14.559c-.883 0-1.49-.648-1.49-1.574 0-.912.62-1.56 1.49-1.56s1.491.648 1.491 1.573c0 .897-.634 1.56-1.49 1.56zm.03-5.152c-2.265 0-3.772 1.437-3.772 3.576 0 2.195 1.451 3.604 3.729 3.604 2.264 0 3.755-1.409 3.755-3.59 0-2.153-1.475-3.59-3.713-3.59zM11.78 6.272c-.856 0-1.395.483-1.395 1.243 0 .774.552 1.257 1.435 1.257.857 0 1.395-.483 1.395-1.257 0-.773-.552-1.243-1.435-1.243zm.152 3.204h-.277c-.675 0-1.187.317-1.187 1.285v4.42c0 .98.496 1.284 1.216 1.284h.275c.677 0 1.16-.33 1.16-1.285v-4.419c0-.995-.47-1.285-1.187-1.285zM8.316 7.392h-.4c-.76 0-1.174.43-1.174 1.285v4.13c0 1.063-.36 1.436-1.2 1.436-.662 0-1.201-.29-1.63-.816C3.87 13.373 3 13.786 3 14.81c0 1.104 1.035 1.781 2.955 1.781 2.334 0 3.563-1.173 3.563-3.742V8.675c0-.856-.413-1.283-1.202-1.283z" fill="#FFF"/></g>
<text x="166" y="100" class="h1">Drop <tspan class="amp" fill="#3535F3">&amp;</tspan> Done: how it works</text>
<text x="166" y="136" class="sub">A pile of bills becomes an approved claim. The AI only reads; plain, tested code makes every decision.</text>
<rect x="128.0" y="216" width="144" height="40" rx="20" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="200" y="244" class="lab" text-anchor="middle" fill="#141414">You drop</text>
<rect x="428.0" y="216" width="144" height="40" rx="20" fill="#F7AB20"/><text x="500" y="244" class="lab" text-anchor="middle" fill="#141414">AI reads</text>
<rect x="702.0" y="216" width="196" height="40" rx="20" fill="#3535F3"/><text x="800" y="244" class="lab" text-anchor="middle" fill="#FFFFFF">Rules decide</text>
<path d="M1000 254 V236 H1500 V254" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1132.5" y="216" width="235" height="40" rx="20" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="1250" y="244" class="lab" text-anchor="middle" fill="#141414">People sign off</text>
<rect x="150" y="312" width="1300" height="12" rx="6" fill="#E8E8FC"/>
<rect x="150" y="312" width="1300" height="12" rx="6" fill="#3535F3" opacity="0.9"/>
<circle cx="200" cy="318" r="52" fill="#FFFFFF"/><circle cx="200" cy="318" r="44" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
<g transform="translate(180,298) scale(1.6667)" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7 9l5 5 5-5M4 16v4h16v-4"/></g>
<text x="200" y="422" class="h2" text-anchor="middle">Drop</text>
<text x="200" y="458" class="b" text-anchor="middle">Photos, PDFs, screenshots,</text>
<text x="200" y="484" class="b" text-anchor="middle">e-tickets and handwritten</text>
<text x="200" y="510" class="b" text-anchor="middle">slips, all at once, into</text>
<text x="200" y="536" class="b" text-anchor="middle">a chat.</text>
<rect x="116.8" y="570" width="166.4" height="32" rx="16" fill="#E8E8FC"/><text x="200" y="591" class="tag" text-anchor="middle">Browser chat app</text>
<circle cx="500" cy="318" r="52" fill="#FFFFFF"/><circle cx="500" cy="318" r="44" fill="#F7AB20" stroke="#F7AB20" stroke-width="4"/>
<g transform="translate(480,298) scale(1.6667)" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3.2"/></g>
<text x="500" y="422" class="h2" text-anchor="middle">Read</text>
<text x="500" y="458" class="b" text-anchor="middle">Pulls out every field with</text>
<text x="500" y="484" class="b" text-anchor="middle">a confidence score, and</text>
<text x="500" y="510" class="b" text-anchor="middle">any sign of tampering.</text>
<text x="500" y="536" class="b" text-anchor="middle">It decides nothing.</text>
<rect x="366.4" y="570" width="267.20000000000005" height="32" rx="16" fill="#E8E8FC"/><text x="500" y="591" class="tag" text-anchor="middle">AI model: server or your key</text>
<circle cx="800" cy="318" r="52" fill="#FFFFFF"/><circle cx="800" cy="318" r="44" fill="#3535F3" stroke="#3535F3" stroke-width="4"/>
<g transform="translate(780,298) scale(1.6667)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L8 4.5M3.5 12l1.5 1.5L8 10.5M3.5 18l1.5 1.5L8 16.5"/></g>
<text x="800" y="422" class="h2" text-anchor="middle">Decide</text>
<text x="800" y="458" class="b" text-anchor="middle">27 policy checks in code:</text>
<text x="800" y="484" class="b" text-anchor="middle">trips, duplicates, alcohol,</text>
<text x="800" y="510" class="b" text-anchor="middle">GST credit, limits. Asks</text>
<text x="800" y="536" class="b" text-anchor="middle">at most 3 questions.</text>
<rect x="683.2" y="570" width="233.60000000000002" height="32" rx="16" fill="#E8E8FC"/><text x="800" y="591" class="tag" text-anchor="middle">Rules engine · 144 tests</text>
<circle cx="1100" cy="318" r="52" fill="#FFFFFF"/><circle cx="1100" cy="318" r="44" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
<g transform="translate(1080,298) scale(1.6667)" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5 20.5 3.5l-6.5 17-3-6.5z M11 14l9.5-10.5"/></g>
<text x="1100" y="422" class="h2" text-anchor="middle">Submit</text>
<text x="1100" y="458" class="b" text-anchor="middle">The ready claim goes to</text>
<text x="1100" y="484" class="b" text-anchor="middle">a mock reimbursement</text>
<text x="1100" y="510" class="b" text-anchor="middle">system in one tap.</text>
<rect x="979.0" y="570" width="242.0" height="32" rx="16" fill="#E8E8FC"/><text x="1100" y="591" class="tag" text-anchor="middle">Server · mock finance API</text>
<circle cx="1400" cy="318" r="52" fill="#FFFFFF"/><circle cx="1400" cy="318" r="44" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
<g transform="translate(1380,298) scale(1.6667)" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M7.5 12.2l3 3 6-6.5"/></g>
<text x="1400" y="422" class="h2" text-anchor="middle">Approve <tspan class="amp">&amp;</tspan> pay</text>
<text x="1400" y="458" class="b" text-anchor="middle">The approver sees only</text>
<text x="1400" y="484" class="b" text-anchor="middle">the exceptions, each with</text>
<text x="1400" y="510" class="b" text-anchor="middle">its policy clause. Finance</text>
<text x="1400" y="536" class="b" text-anchor="middle">marks it paid.</text>
<rect x="1325.2" y="570" width="149.60000000000002" height="32" rx="16" fill="#E8E8FC"/><text x="1400" y="591" class="tag" text-anchor="middle">Approver inbox</text>
<line x1="80" y1="646" x2="1520" y2="646" stroke="#E0E0E0" stroke-width="2"/>
<text x="80" y="700" class="h3">Built and running in the prototype</text><circle cx="91" cy="738" r="11" fill="#3535F3"/><path d="M86 738l3.5 3.5 6.5-7" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="744" class="li">Chat app: drop bills, answer, submit, see the evidence</text><circle cx="91" cy="776" r="11" fill="#3535F3"/><path d="M86 776l3.5 3.5 6.5-7" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="782" class="li">Live AI reading, swappable model; key on server or in browser</text><circle cx="91" cy="814" r="11" fill="#3535F3"/><path d="M86 814l3.5 3.5 6.5-7" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="820" class="li">Rules engine with 27 policy checks and 144 tests</text><circle cx="91" cy="852" r="11" fill="#3535F3"/><path d="M86 852l3.5 3.5 6.5-7" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="858" class="li">Mock reimbursement system and approver inbox</text><circle cx="91" cy="890" r="11" fill="#3535F3"/><path d="M86 890l3.5 3.5 6.5-7" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="896" class="li">Demo mode that runs offline on 12 synthetic bills</text><circle cx="91" cy="928" r="11" fill="#3535F3"/><path d="M86 928l3.5 3.5 6.5-7" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="934" class="li">GSTIN checksum, duplicate and tamper checks</text>
<line x1="800" y1="680" x2="800" y2="926" stroke="#E0E0E0" stroke-width="2"/>
<text x="840" y="700" class="h3">Next, for production</text><circle cx="851" cy="738" r="10" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="4 3.5"/><text x="874" y="744" class="lip">WhatsApp, Teams and JioChat as entry points</text><circle cx="851" cy="776" r="10" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="4 3.5"/><text x="874" y="782" class="lip">HRMS and SSO for employee, grade and approver</text><circle cx="851" cy="814" r="10" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="4 3.5"/><text x="874" y="820" class="lip">Database and bill storage (claims are in memory today)</text><circle cx="851" cy="852" r="10" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="4 3.5"/><text x="874" y="858" class="lip">Rules re-run on the server before approval</text><circle cx="851" cy="890" r="10" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="4 3.5"/><text x="874" y="896" class="lip">Live GSTN lookup, PII masking, India data residency</text><circle cx="851" cy="928" r="10" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="4 3.5"/><text x="874" y="934" class="lip">Real payouts through SAP or Oracle</text>
<text x="80" y="974" class="foot">All bills, businesses, people and GSTINs shown are synthetic.</text>
<text x="1520" y="974" class="foot" text-anchor="end">Reliance Jio AI Innovation Lab · Case 1, Expense <tspan class="amp">&amp;</tspan> Reimbursement Agent</text>
</svg>
