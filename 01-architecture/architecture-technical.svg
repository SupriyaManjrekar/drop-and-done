<text x="334" y="246" class="code" text-anchor="start">samples.js</text>
<text x="334" y="272" class="b" text-anchor="start">12 synthetic bills +</text>
<text x="334" y="293" class="b" text-anchor="start">pre-computed reads (demo)</text>
<rect x="548" y="216" width="216" height="96" rx="12" fill="#FFFFFF" stroke="#D6D6EA" stroke-width="1.5"/>
<text x="566" y="246" class="code" text-anchor="start">policy.js</text>
<text x="566" y="272" class="b" text-anchor="start">TRV-EXP-2026.2 as data,</text>
<text x="566" y="293" class="b" text-anchor="start">GSTIN mod-36 checksum</text>
<rect x="780" y="216" width="216" height="96" rx="12" fill="#FFFFFF" stroke="#F7AB20" stroke-width="2.5"/>
<text x="798" y="246" class="code" text-anchor="start">ai.js</text>
<text x="798" y="272" class="b" text-anchor="start">Prompt + strict schema;</text>
<text x="798" y="293" class="b" text-anchor="start">value + confidence each</text>
<text x="84" y="352" class="al" text-anchor="start">Per file</text><text x="152" y="352" class="b" text-anchor="start">SHA-256 hash  →  images downscaled to 1800 px JPEG  →  4 files in parallel  →  one request each</text>
