<text x="908" y="932" class="b" text-anchor="start" style="font-size:16px">Every flag carries its policy clause and evidence</text>
<circle cx="889" cy="956" r="9" fill="#3535F3"/><path d="M885 956l3 3 5-6" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="908" y="961" class="b" text-anchor="start" style="font-size:16px">Demo mode replays pre-computed reads, works offline</text>
