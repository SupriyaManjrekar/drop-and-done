<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" role="img" aria-labelledby="t d">
<title id="t">Drop &amp; Done: technical architecture</title>
<desc id="d">A static browser app and a zero-dependency local Java server. The browser modules prepare each file, an AI vision model returns fields with confidence through the server proxy, and the deterministic engine builds lines, evaluates policy, groups trips, plans questions and builds the submission. The server holds claims in memory and enforces state transitions.</desc>
