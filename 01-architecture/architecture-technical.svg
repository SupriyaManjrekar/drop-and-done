<text x="152" y="86" class="h1">Drop <tspan class="amp" fill="#3535F3">&amp;</tspan> Done: technical architecture</text>
<text x="152" y="118" class="sub">A static browser app plus one zero-dependency Java server. The model returns fields; <tspan font-family="JetBrains Mono, Menlo, monospace" font-weight="700" fill="#141414">engine.js</tspan> makes every decision.</text>
