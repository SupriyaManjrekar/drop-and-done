<text x="60" y="1036" class="foot" text-anchor="start">All bills, businesses, people and GSTINs are synthetic. Claims are held in memory and reset on restart.</text>
<text x="1540" y="1036" class="foot" text-anchor="end">Reliance Jio AI Innovation Lab · Case 1, Expense <tspan class="amp">&amp;</tspan> Reimbursement Agent</text>
