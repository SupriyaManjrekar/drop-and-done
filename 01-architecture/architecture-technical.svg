<text x="1074" y="528" class="cs" text-anchor="start" fill="#3535F3">GET</text><text x="1107.8" y="528" class="cs" text-anchor="start" fill="#141414">/api/claims</text>
<text x="1074" y="548" class="b" text-anchor="start">in-memory claim store</text>
<rect x="1060" y="574" width="268" height="52" rx="10" fill="#FFFFFF" stroke="#D6D6EA" stroke-width="1.5"/>
<text x="1074" y="596" class="cs" text-anchor="start" fill="#3535F3">POST</text><text x="1116.4" y="596" class="cs" text-anchor="start" fill="#141414">/…/{id}/decision</text>
<text x="1074" y="616" class="b" text-anchor="start">legal moves only, else 409</text>
<rect x="1060" y="642" width="268" height="52" rx="10" fill="#FFFFFF" stroke="#D6D6EA" stroke-width="1.5"/>
<text x="1074" y="664" class="cs" text-anchor="start" fill="#3535F3">GET</text><text x="1107.8" y="664" class="cs" text-anchor="start" fill="#141414">static files</text>
<text x="1074" y="684" class="b" text-anchor="start">app + deck, no path traversal</text>
